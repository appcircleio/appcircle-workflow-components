platform: Common
buildPlatform: JavaKotlin, ObjectiveCSwift
displayName: "MobSF Binary Scan"
description: "Scans the built APK, AAB or IPA for security issues"
docsUrl: https://docs.appcircle.io/workflows/common-workflow-steps/mobsf-binary-scan
requiredComponents:
precedingComponents: "appcircle_android_build,appcircle_ios_build_sign"
followingComponents: "appcircle_export_build_artifacts"
webUrl: https://github.com/appcircleio/appcircle-mobsf-binary-scan
repoUrl: https://github.com/appcircleio/appcircle-mobsf-binary-scan.git
commit: 0dcccdb
inputs:
- key: "AC_MOBSF_ARTIFACT_PATH"
  isRequired: false
  title: Artifact Path
  description: "The APK, AAB or IPA to scan, or the folder holding it. When empty the step uses AC_APK_PATH, AC_AAB_PATH, or the .ipa under AC_EXPORT_DIR."
  helpText:
- key: "AC_MOBSF_FAIL_ON"
  defaultValue: "critical"
  isRequired: false
  editorType: select
  options: "critical,normal,low,none"
  title: Fail Build On
  description: "Breaks the pipeline when the report holds a finding at this level or worse. `low` is strictest, `none` only reports."
  helpText:
- key: "AC_MOBSF_MIN_SCORE"
  isRequired: false
  title: Minimum Security Score
  description: "Breaks the pipeline when the MobSF score out of 100 falls below this. Empty disables the check. It is checked independently of Fail Build On, so either gate on its own breaks the build."
  helpText:
- key: "AC_MOBSF_SCAN_TIMEOUT"
  defaultValue: "1800"
  isRequired: false
  title: Scan Timeout
  description: "Timeout in seconds for the MobSF scan. Keep it above 2000 for large binaries."
  helpText:
- key: "AC_MOBSF_SAVE_REPORT"
  defaultValue: "true"
  isRequired: false
  editorType: select
  options: "true,false"
  title: Save Report
  description: "The JSON report will be copied into the artifacts folder if set to true. JSON is the only format MobSF reports here, its PDF export needs `wkhtmltopdf`, which is not installed on the runners."
  helpText:
outputs:
- key: "AC_MOBSF_SCANNED_ARTIFACT"
  title: "Scanned Artifact"
  defaultValue: "AC_MOBSF_SCANNED_ARTIFACT"
  description: "Specifies the artifact that was scanned."
  helpText:
- key: "AC_MOBSF_SECURITY_SCORE"
  title: "Security Score"
  defaultValue: "AC_MOBSF_SECURITY_SCORE"
  description: "Specifies the MobSF security score out of 100."
  helpText:
- key: "AC_MOBSF_FINDING_COUNT"
  title: "Finding Count"
  defaultValue: "AC_MOBSF_FINDING_COUNT"
  description: "Specifies the total number of findings."
  helpText:
- key: "AC_MOBSF_CRITICAL_COUNT"
  title: "Critical Count"
  defaultValue: "AC_MOBSF_CRITICAL_COUNT"
  description: "Specifies the number of critical findings."
  helpText:
- key: "AC_MOBSF_NORMAL_COUNT"
  title: "Normal Count"
  defaultValue: "AC_MOBSF_NORMAL_COUNT"
  description: "Specifies the number of normal findings."
  helpText:
- key: "AC_MOBSF_LOW_COUNT"
  title: "Low Count"
  defaultValue: "AC_MOBSF_LOW_COUNT"
  description: "Specifies the number of low findings."
  helpText:
- key: "AC_MOBSF_WORST_LEVEL"
  title: "Worst Level Found"
  defaultValue: "AC_MOBSF_WORST_LEVEL"
  description: "Specifies the worst level found: `critical`, `normal`, `low`, or `none`."
  helpText:
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
- "main.rb"
