platform: iOS
airgapSupport: true
buildPlatform: ObjectiveCSwift
displayName: Tuist Install
description: "Install Tuist and Generate a Project."
docsUrl: https://docs.appcircle.io/workflows/ios-specific-workflow-steps/tuist
requiredComponents: "appcircle_git_clone"
precedingComponents: 
followingComponents: "appcircle_export_build_artifacts"
webUrl: https://github.com/appcircleio/appcircle-tuist-component
repoUrl: https://github.com/appcircleio/appcircle-tuist-component.git
commit: 09b7e55
inputs:
- key: "AC_TUIST_PATH"
  defaultValue: "$AC_REPOSITORY_DIR"
  isRequired: true
  title: Project Path
  description: The path to the directory of Tuist project. By default, it is set to the root directory of the cloned repository.
  helpText:
- key: "AC_TUIST_VERSION"
  isRequired: false
  title: Tuist Version
  description: The version of Tuist, you can specify a specific Tuist version. If it is empty, Appcircle installs Tuist 4.214.0. The step skips the download when this version is already on PATH.
  helpText:
- key: "AC_TUIST_BASE_URL"
  isRequired: false
  title: Tuist Download Base URL
  description: "Base URL of the Tuist release downloads. Defaults to: https://github.com/tuist/tuist/releases/download. Set it to an internal mirror to install Tuist without internet access."
  helpText:
outputs:
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
- "main.rb"
