platform: Common
airgapSupport: true
buildPlatform: Flutter
displayName: Flutter Install
description: "Install spesificed flutter version. Defaults to: stable. You can use any available tag or branch in Flutter SDK repo."
docsUrl: https://docs.appcircle.io/workflows/flutter-specific-workflow-steps/flutter-install
requiredComponents: 
precedingComponents: "appcircle_flutter_mirror"
followingComponents: 
webUrl: https://github.com/appcircleio/appcircle-flutter-install-component
repoUrl: https://github.com/appcircleio/appcircle-flutter-install-component.git
commit: dbf2a0b
inputs:
- key: "AC_SELECTED_FLUTTER_VERSION"
  isRequired: false
  title: Selected Flutter Version
  description: "Flutter version or channel (stable, beta). Branches and commits require GitHub access. Defaults to: stable. The version you set on config section will override this setting."
  helpText:
- key: "AC_FLUTTER_STORAGE_BASE_URL"
  isRequired: false
  title: Flutter Storage Base URL
  description: "Base URL of the Flutter release archives. Defaults to: https://storage.googleapis.com. Set it to an internal mirror to install Flutter without internet access."
  helpText:
outputs:
- key: "PATH"
  defaultValue: "PATH"
  title: PATH Variable
  description: PATH variable that add Flutter tool for your workflow.
  helpText:
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
- "main.rb"