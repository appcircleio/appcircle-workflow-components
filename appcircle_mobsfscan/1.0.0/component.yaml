platform: Common
buildPlatform: JavaKotlin, ObjectiveCSwift
displayName: "MobSF Source Code Scan"
description: "Scans Android and iOS source code for security issues"
docsUrl: https://docs.appcircle.io/workflows/common-workflow-steps/mobsfscan
requiredComponents: "appcircle_git_clone"
precedingComponents:
followingComponents: "appcircle_export_build_artifacts"
webUrl: https://github.com/appcircleio/appcircle-mobsfscan-component
repoUrl: https://github.com/appcircleio/appcircle-mobsfscan-component.git
commit: b3dd704
inputs:
- key: "AC_REPOSITORY_DIR"
  defaultValue: "$AC_REPOSITORY_DIR"
  isRequired: true
  title: Repository Directory
  description: "Specifies the cloned repository directory."
  helpText:
- key: "AC_MOBSFSCAN_SOURCE_PATH"
  defaultValue: "$AC_REPOSITORY_DIR"
  isRequired: false
  title: Source Path
  description: "Path of the source code to scan. A relative value resolves against the repository directory."
  helpText:
- key: "AC_MOBSFSCAN_SCAN_MODE"
  defaultValue: "light"
  isRequired: false
  editorType: select
  options: "light,advance"
  title: Scan Mode
  description: "`light` runs the mobsfscan CLI. `advance` uses the runner's MobSF and falls back to `light` when it is unavailable."
  helpText:
- key: "AC_MOBSFSCAN_SCAN_TYPE"
  defaultValue: "auto"
  isRequired: false
  editorType: select
  options: "auto,android,ios"
  title: Scan Type
  description: "Rule set to use. `auto` detects the platform from the source code."
  helpText:
- key: "AC_MOBSFSCAN_VERSION"
  defaultValue: "1.0.0"
  isRequired: true
  title: mobsfscan Version
  description: "The `mobsfscan` version to install with pip. Pinned for reproducible builds."
  helpText:
- key: "AC_MOBSFSCAN_OUTPUT_FORMATS"
  defaultValue: "sarif"
  isRequired: false
  editorType: select
  options: "sarif,json,html,sonarqube,gitlab-sast"
  title: Output Format
  description: "Report format for the `light` scan. The `advance` mode supports JSON only."
  helpText:
- key: "AC_MOBSFSCAN_SEVERITY_THRESHOLD"
  defaultValue: "critical"
  isRequired: false
  editorType: select
  options: "critical,normal,low,none"
  title: Fail Build On
  description: "Breaks the pipeline on a finding at this level or worse. `low` is strictest, `none` only reports."
  helpText:
- key: "AC_MOBSFSCAN_MIN_SCORE"
  defaultValue: "0"
  isRequired: false
  title: Fail Build Minimum Security Score
  description: "Breaks the pipeline below this MobSF score out of 100. `0` disables it, and only the `advance` scan reports a score."
  helpText:
- key: "AC_MOBSFSCAN_CONFIG_PATH"
  isRequired: false
  title: Config File Path
  description: "Path of the `.mobsf` rule tuning config. When empty, a `.mobsf` at the scan root is used."
  helpText:
- key: "AC_MOBSFSCAN_SAVE_REPORT"
  defaultValue: "true"
  isRequired: false
  editorType: select
  options: "true,false"
  title: Save Report
  description: "Copies the report into the artifacts folder when true."
  helpText:
- key: "AC_MOBSFSCAN_TIMEOUT"
  defaultValue: "900"
  isRequired: false
  title: Scan Timeout
  description: "Timeout in seconds for a single mobsfscan run."
  helpText:
- key: "AC_MOBSFSCAN_ADVANCE_TIMEOUT"
  defaultValue: "1800"
  isRequired: false
  title: Advance Scan Timeout
  description: "Timeout in seconds for the MobSF scan in `advance` mode."
  helpText:
- key: "AC_MOBSFSCAN_EXTRA_PARAMETERS"
  isRequired: false
  title: Scanner Parameters
  description: "Extra mobsfscan parameters, passed as separate arguments."
  helpText:
outputs:
- key: "AC_MOBSFSCAN_SCAN_MODE_USED"
  title: "Scan Mode Used"
  defaultValue: "AC_MOBSFSCAN_SCAN_MODE_USED"
  description: "Which scan ran, `light` or `advance`."
  helpText:
- key: "AC_MOBSFSCAN_SECURITY_SCORE"
  title: "Security Score"
  defaultValue: "AC_MOBSFSCAN_SECURITY_SCORE"
  description: "The MobSF score out of 100. Only set by the advance scan."
  helpText:
- key: "AC_MOBSFSCAN_FINDING_COUNT"
  title: "Finding Count"
  defaultValue: "AC_MOBSFSCAN_FINDING_COUNT"
  description: "Total number of findings."
  helpText:
- key: "AC_MOBSFSCAN_CRITICAL_COUNT"
  title: "Critical Count"
  defaultValue: "AC_MOBSFSCAN_CRITICAL_COUNT"
  description: "Number of critical findings."
  helpText:
- key: "AC_MOBSFSCAN_NORMAL_COUNT"
  title: "Normal Count"
  defaultValue: "AC_MOBSFSCAN_NORMAL_COUNT"
  description: "Number of normal findings."
  helpText:
- key: "AC_MOBSFSCAN_LOW_COUNT"
  title: "Low Count"
  defaultValue: "AC_MOBSFSCAN_LOW_COUNT"
  description: "Number of low findings."
  helpText:
- key: "AC_MOBSFSCAN_WORST_LEVEL"
  title: "Worst Level Found"
  defaultValue: "AC_MOBSFSCAN_WORST_LEVEL"
  description: "The worst level found: `critical`, `normal`, `low`, or `none`."
  helpText:
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
- "main.rb"
- "mobsf.rb"
