platform: Common
buildPlatform: JavaKotlin, ObjectiveCSwift
displayName: "MobSF Source Code Scan"
description: "Scans Android and iOS source code for security issues"
docsUrl: https://docs.appcircle.io/workflows/common-workflow-steps/mobsfscan
requiredComponents: "appcircle_git_clone"
precedingComponents:
followingComponents: "appcircle_export_build_artifacts"
webUrl: https://github.com/appcircleio/appcircle-mobsfscan-component
repoUrl: https://github.com/appcircleio/appcircle-mobsfscan-component.git
commit: ea36090
inputs:
- key: "AC_REPOSITORY_DIR"
  defaultValue: "$AC_REPOSITORY_DIR"
  isRequired: true
  title: Repository Directory
  description: "Specifies the cloned repository directory."
  helpText:
- key: "AC_MOBSFSCAN_SOURCE_PATH"
  defaultValue: "$AC_REPOSITORY_DIR"
  isRequired: false
  title: Source Path
  description: "Path of the source code to scan. A relative value is resolved against the cloned repository directory."
  helpText:
- key: "AC_MOBSFSCAN_SCAN_MODE"
  defaultValue: "light"
  isRequired: false
  editorType: select
  options: "light,advance"
  title: Scan Mode
  description: "`light` runs the mobsfscan CLI. `advance` uses the runner's MobSF, falling back to `light`."
  helpText:
- key: "AC_MOBSFSCAN_SCAN_TYPE"
  defaultValue: "auto"
  isRequired: false
  editorType: select
  options: "auto,android,ios"
  title: Scan Type
  description: "Rule set to use. `auto` detects the platform from the source code."
  helpText:
- key: "AC_MOBSFSCAN_VERSION"
  defaultValue: "1.0.0"
  isRequired: true
  title: mobsfscan Version
  description: "The `mobsfscan` version to install with pip. Pinned so that builds stay reproducible."
  helpText:
- key: "AC_MOBSFSCAN_OUTPUT_FORMATS"
  defaultValue: "sarif"
  isRequired: false
  editorType: select
  options: "sarif,json,html,sonarqube,gitlab-sast"
  title: Output Format
  description: "Report format to publish. The variable also accepts a comma separated list."
  helpText:
- key: "AC_MOBSFSCAN_SEVERITY_THRESHOLD"
  defaultValue: "critical"
  isRequired: false
  editorType: select
  options: "critical,normal,low,none"
  title: Fail Build On
  description: "Breaks the pipeline when the report holds a finding at this level or worse. `low` is strictest, `none` only reports."
  helpText:
- key: "AC_MOBSFSCAN_CONFIG_PATH"
  isRequired: false
  title: Config File Path
  description: "Path of the `.mobsf` config for rule tuning. When empty, a `.mobsf` file at the scan root is used."
  helpText:
- key: "AC_MOBSFSCAN_SAVE_REPORT"
  defaultValue: "true"
  isRequired: false
  editorType: select
  options: "true,false"
  title: Save Report
  description: "Report files will be copied into the artifacts folder if set to true."
  helpText:
- key: "AC_MOBSFSCAN_TIMEOUT"
  defaultValue: "900"
  isRequired: false
  title: Scan Timeout
  description: "Timeout in seconds for a single mobsfscan run."
  helpText:
- key: "AC_MOBSFSCAN_ADVANCE_TIMEOUT"
  defaultValue: "1800"
  isRequired: false
  title: Advance Scan Timeout
  description: "Timeout in seconds for the MobSF scan in `advance` mode."
  helpText:
- key: "AC_MOBSFSCAN_EXTRA_PARAMETERS"
  isRequired: false
  title: Scanner Parameters
  description: "Extra command line parameters for mobsfscan, passed as separate arguments."
  helpText:
outputs:
- key: "AC_MOBSFSCAN_SCAN_MODE_USED"
  title: "Scan Mode Used"
  defaultValue: "AC_MOBSFSCAN_SCAN_MODE_USED"
  description: "Specifies which scan actually ran, `light` or `advance`."
  helpText:
- key: "AC_MOBSFSCAN_JSON_REPORT_PATH"
  title: "JSON Report Path"
  defaultValue: "AC_MOBSFSCAN_JSON_REPORT_PATH"
  description: "Specifies the path of the JSON report, when `json` was requested."
  helpText:
- key: "AC_MOBSFSCAN_MOBSF_REPORT_PATH"
  title: "MobSF Report Path"
  defaultValue: "AC_MOBSFSCAN_MOBSF_REPORT_PATH"
  description: "Specifies the path of the MobSF JSON report. Only set when the advance scan ran."
  helpText:
- key: "AC_MOBSFSCAN_SECURITY_SCORE"
  title: "Security Score"
  defaultValue: "AC_MOBSFSCAN_SECURITY_SCORE"
  description: "Specifies the MobSF security score out of 100. Only set when the advance scan ran."
  helpText:
- key: "AC_MOBSFSCAN_FINDING_COUNT"
  title: "Finding Count"
  defaultValue: "AC_MOBSFSCAN_FINDING_COUNT"
  description: "Specifies the total number of findings."
  helpText:
- key: "AC_MOBSFSCAN_CRITICAL_COUNT"
  title: "Critical Count"
  defaultValue: "AC_MOBSFSCAN_CRITICAL_COUNT"
  description: "Specifies the number of critical findings."
  helpText:
- key: "AC_MOBSFSCAN_NORMAL_COUNT"
  title: "Normal Count"
  defaultValue: "AC_MOBSFSCAN_NORMAL_COUNT"
  description: "Specifies the number of normal findings."
  helpText:
- key: "AC_MOBSFSCAN_LOW_COUNT"
  title: "Low Count"
  defaultValue: "AC_MOBSFSCAN_LOW_COUNT"
  description: "Specifies the number of low findings."
  helpText:
- key: "AC_MOBSFSCAN_WORST_LEVEL"
  title: "Worst Level Found"
  defaultValue: "AC_MOBSFSCAN_WORST_LEVEL"
  description: "Specifies the worst level found: `critical`, `normal`, `low`, or `none`."
  helpText:
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
- "main.rb"
- "mobsf.rb"
